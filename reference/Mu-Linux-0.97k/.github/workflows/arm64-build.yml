name: ARM64 Docker build

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: arm64-build-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-arm64:
    name: Build linux/arm64 image
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build ARM64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          load: true
          push: false
          tags: mu-linux-97k:arm64-ci

      - name: Smoke-test ARM64 server binary
        run: |
          docker run --rm --platform linux/arm64 \
            --entrypoint /bin/sh \
            -w /opt/mu/ConnectServer \
            mu-linux-97k:arm64-ci \
            -ec '
              test "$(uname -m)" = "aarch64"
              ./ConnectServer &
              server_pid=$!
              sleep 5
              kill -0 "$server_pid"
              kill "$server_pid"
              wait "$server_pid" || true
            '
