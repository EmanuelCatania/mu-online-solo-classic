<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>MU Online Solo Classic</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <!-- Fullscreen MU Preloader -->
    <div id="muPreloader" class="mu-preloader">
      <div class="mu-preloader-bg"></div>
      <canvas id="muParticleCanvas" class="mu-particle-canvas"></canvas>

      <div class="mu-preloader-card">
        <!-- Strict Modern Title -->
        <div class="mu-title-section">
          <h1 class="mu-preloader-title">MU ONLINE</h1>
          <div class="mu-preloader-sub">SOLO CLASSIC 0.97K</div>
        </div>

        <!-- Sleek Modern Progress HUD -->
        <div class="mu-progress-box">
          <div class="mu-progress-meta">
            <div class="mu-status-label-wrap">
              <span class="mu-status-pulse-dot"></span>
              <span id="muStatusMsg">Initializing client...</span>
            </div>
            <span id="muStatusDetail">0%</span>
          </div>
          <div class="mu-bar-track">
            <div id="muBarFill" class="mu-bar-fill" style="width: 3%;">
              <div class="mu-bar-plasma"></div>
            </div>
          </div>
        </div>

        <!-- Clean Gameplay Tips Box -->
        <div class="mu-tips-box">
          <span class="mu-tip-tag">TIP</span>
          <span id="muTipText" class="mu-tip-msg">Loading game assets...</span>
        </div>
      </div>
    </div>

    <div id="status">Starting…</div>
    <pre id="log"></pre>
    <canvas id="canvas" width="640" height="480" tabindex="-1" oncontextmenu="return false"></canvas>
    <div id="muStick" aria-label="Move"><div id="muStickKnob"></div></div>
    <button id="muRBtn" type="button" aria-label="Right mouse">
      <svg width="28" height="28" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.6">
        <rect x="7" y="3" width="14" height="22" rx="7"></rect>
        <path d="M14 3v9h7"></path>
        <path d="M15 6.5h4.2" stroke-width="2.4"></path>
      </svg>
    </button>
    <button id="muKeyBtn" type="button" aria-label="Keyboard">
      <svg width="26" height="18" viewBox="0 0 26 18" fill="none" stroke="currentColor" stroke-width="1.6">
        <rect x="1" y="1" width="24" height="16" rx="2"></rect>
        <path d="M4 5h2M8 5h2M12 5h2M16 5h2M20 5h2M5 9h2M9 9h2M13 9h2M17 9h2M6 13h14"></path>
      </svg>
    </button>
    <div id="muKeys">
      <div class="row">
        <button type="button" data-vk="49" data-ch="49">1</button>
        <button type="button" data-vk="50" data-ch="50">2</button>
        <button type="button" data-vk="51" data-ch="51">3</button>
        <button type="button" data-vk="52" data-ch="52">4</button>
        <button type="button" data-vk="53" data-ch="53">5</button>
        <button type="button" data-vk="54" data-ch="54">6</button>
        <button type="button" data-vk="55" data-ch="55">7</button>
        <button type="button" data-vk="56" data-ch="56">8</button>
        <button type="button" data-vk="57" data-ch="57">9</button>
        <button type="button" data-vk="48" data-ch="48">0</button>
      </div>
      <div class="row">
        <button type="button" data-vk="81" data-ch="113">q</button>
        <button type="button" data-vk="87" data-ch="119">w</button>
        <button type="button" data-vk="69" data-ch="101">e</button>
        <button type="button" data-vk="82" data-ch="114">r</button>
        <button type="button" data-vk="84" data-ch="116">t</button>
        <button type="button" data-vk="89" data-ch="121">y</button>
        <button type="button" data-vk="85" data-ch="117">u</button>
        <button type="button" data-vk="73" data-ch="105">i</button>
        <button type="button" data-vk="79" data-ch="111">o</button>
        <button type="button" data-vk="80" data-ch="112">p</button>
      </div>
      <div class="row">
        <button type="button" data-vk="65" data-ch="97">a</button>
        <button type="button" data-vk="83" data-ch="115">s</button>
        <button type="button" data-vk="68" data-ch="100">d</button>
        <button type="button" data-vk="70" data-ch="102">f</button>
        <button type="button" data-vk="71" data-ch="103">g</button>
        <button type="button" data-vk="72" data-ch="104">h</button>
        <button type="button" data-vk="74" data-ch="106">j</button>
        <button type="button" data-vk="75" data-ch="107">k</button>
        <button type="button" data-vk="76" data-ch="108">l</button>
      </div>
      <div class="row">
        <button type="button" class="wide" data-lock="16">shift</button>
        <button type="button" data-vk="90" data-ch="122">z</button>
        <button type="button" data-vk="88" data-ch="120">x</button>
        <button type="button" data-vk="67" data-ch="99">c</button>
        <button type="button" data-vk="86" data-ch="118">v</button>
        <button type="button" data-vk="66" data-ch="98">b</button>
        <button type="button" data-vk="78" data-ch="110">n</button>
        <button type="button" data-vk="77" data-ch="109">m</button>
        <button type="button" class="wide" data-vk="8" data-ch="8">⌫</button>
      </div>
      <div class="row">
        <button type="button" data-vk="27">esc</button>
        <button type="button" data-lock="17">ctrl</button>
        <button type="button" class="space" data-vk="32" data-ch="32">space</button>
        <button type="button" data-vk="37">←</button>
        <button type="button" data-vk="38">↑</button>
        <button type="button" data-vk="40">↓</button>
        <button type="button" data-vk="39">→</button>
        <button type="button" class="wide" data-vk="13" data-ch="13">enter</button>
      </div>
    </div>

    <!-- Preloader Lifecycle & Dynamic Particles -->
    <script src="preloader.js"></script>

    <!-- Application Controller & Client/Server Worker Bridge -->
    <script src="app.js"></script>

    <!-- WebGL2 WebAssembly Game Client Core -->
    <script async type="text/javascript" src="shell_login.js?t=login100"></script>
  </body>
</html>
